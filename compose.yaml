services:
  postgres:
    image: postgres:17-alpine
    container_name: genealogiq-postgres
    environment:
      POSTGRES_DB: genealogiq
      POSTGRES_USER: genealogiq
      POSTGRES_PASSWORD: genealogiq
    ports:
      - "5432:5432"
    volumes:
      - genealogiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genealogiq -d genealogiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: genealogiq-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - genealogiq-azurite-data:/data

volumes:
  genealogiq-postgres-data:
  genealogiq-azurite-data:
