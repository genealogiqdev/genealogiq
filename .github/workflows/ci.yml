name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Monorepo quality gates: typecheck, tests, the single-schema guard and lint are
# all blocking. Dependency audit is informational (Dependabot opens the fix PRs).
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma generate/validate never connect to the DB — a dummy URL suffices.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      RUN_AZURITE_TESTS: "true"
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:10000/devstoreaccount1/media
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field —
      # do NOT also set "version" here, or action-setup errors on the mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Azurite
        run: >-
          docker run --detach --rm --name azurite
          --publish 10000:10000
          mcr.microsoft.com/azure-storage/azurite:3.35.0
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

      - name: Generate Prisma clients
        run: pnpm db:generate

      - name: Type check (blocking)
        run: pnpm typecheck

      - name: Unit tests (blocking)
        run: pnpm test

      - name: Single-schema guard (blocking)
        run: pnpm check:schema-parity

      # Structure only — no DB credential in PR CI. Applying migrations is the
      # Migrate workflow's job, gated behind the production environment.
      - name: Migration structure guard (blocking)
        run: pnpm check:migrations

      - name: Validate Azure infrastructure (blocking)
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: i18n parity guard (blocking)
        run: pnpm check:i18n-parity

      - name: i18n key/structure guard (blocking)
        run: pnpm check:i18n-keys

      - name: Lint (blocking)
        run: pnpm lint

      # Surfaces known high/critical advisories in dependencies. Informational
      # for now (Dependabot opens the fix PRs); flip to blocking once the audit
      # baseline is clean.
      - name: Dependency audit (informational)
        run: pnpm audit --audit-level high || true

  containers:
    name: container (${{ matrix.app }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, bms, seq]
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --target app-runtime \
            --build-arg APP=${{ matrix.app }} \
            --tag genealogiq-${{ matrix.app }}:ci \
            .

      - name: Smoke-test liveness
        run: |
          docker run --detach --rm \
            --name smoke-${{ matrix.app }} \
            --publish 3000:3000 \
            --env DATABASE_URL=postgresql://user:pass@localhost:5432/db \
            --env AUTH_SECRET=ci-container-smoke-secret \
            genealogiq-${{ matrix.app }}:ci
          trap 'docker stop smoke-${{ matrix.app }} || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:3000/api/health/live
