name: Migrate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 3a3cc663-19dc-47f6-908e-4ce9b3a57195
  AZURE_TENANT_ID: 14b55441-6057-45a1-b710-23b0616796ae
  AZURE_SUBSCRIPTION_ID: c710b26f-e3c7-4a45-9477-eaaf3bdcc329
  RESOURCE_GROUP: rg-genealogiq-prod

jobs:
  deploy:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Apply migrations
        run: |
          execution="$(az containerapp job start \
            --name job-genealogiq-migrate-prod \
            --resource-group "$RESOURCE_GROUP" \
            --query name --output tsv)"
          for attempt in {1..60}; do
            status="$(az containerapp job execution show \
              --name job-genealogiq-migrate-prod \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status --output tsv)"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped)
                az containerapp job logs show \
                  --name job-genealogiq-migrate-prod \
                  --resource-group "$RESOURCE_GROUP" \
                  --execution "$execution" \
                  --tail 100 || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Migration job timed out." >&2
          exit 1
